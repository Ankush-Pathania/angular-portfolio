<section
    id="services"
    class="services-section relative z-0 bg-[var(--bg-light)] px-5 pb-20 pt-20 sm:rounded-t-[50px] sm:px-8 sm:pb-24 sm:pt-24 md:rounded-t-[60px] md:px-10 md:pb-32 md:pt-28 rounded-t-[40px]"
>
    <h2
        class="display-heading display-heading--solid relative z-10 mb-10 text-center sm:mb-14 md:mb-20"
        style="font-size: clamp(2.75rem, 10vw, 140px)"
        appFadeIn
        [fadeDelay]="0"
        [fadeY]="40"
    >
        Services
    </h2>

    <div class="relative z-10 mx-auto max-w-5xl">
        <div
            *ngFor="let service of services; let i = index; trackBy: trackByNumber"
            #serviceRow
            class="service-row"
            [style.--delay]="i * 0.08 + 's'"
        >
            <span class="service-number">{{ service.number }}</span>
            <div class="service-copy">
                <h3>{{ service.name }}</h3>
                <p>{{ service.description }}</p>
            </div>
        </div>
    </div>
</section>
