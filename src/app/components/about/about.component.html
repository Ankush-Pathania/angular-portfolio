<section
    id="about"
    class="relative flex min-h-screen items-center justify-center overflow-x-hidden bg-[var(--bg-dark)] px-5 py-20 sm:px-8 md:px-10"
>
    <img
        [src]="decor.moon"
        alt=""
        class="pointer-events-none absolute left-[1%] top-[4%] z-0 w-[120px] select-none sm:left-[2%] sm:w-[160px] md:left-[4%] md:w-[210px]"
        appFadeIn
        [fadeDelay]="0.1"
        [fadeX]="-80"
        [fadeY]="0"
        [fadeDuration]="0.9"
    />
    <img
        [src]="decor.object"
        alt=""
        class="pointer-events-none absolute bottom-[8%] left-[3%] z-0 w-[100px] select-none sm:left-[6%] sm:w-[140px] md:left-[10%] md:w-[180px]"
        appFadeIn
        [fadeDelay]="0.25"
        [fadeX]="-80"
        [fadeY]="0"
        [fadeDuration]="0.9"
    />
    <img
        [src]="decor.lego"
        alt=""
        class="pointer-events-none absolute right-[1%] top-[4%] z-0 w-[120px] select-none sm:right-[2%] sm:w-[160px] md:right-[4%] md:w-[210px]"
        appFadeIn
        [fadeDelay]="0.15"
        [fadeX]="80"
        [fadeY]="0"
        [fadeDuration]="0.9"
    />
    <img
        [src]="decor.group"
        alt=""
        class="pointer-events-none absolute bottom-[8%] right-[3%] z-0 w-[130px] select-none sm:right-[6%] sm:w-[170px] md:right-[10%] md:w-[220px]"
        appFadeIn
        [fadeDelay]="0.3"
        [fadeX]="80"
        [fadeY]="0"
        [fadeDuration]="0.9"
    />

    <div class="relative z-10 flex w-full max-w-4xl flex-col items-center text-center">
        <div class="flex flex-col items-center gap-10 sm:gap-14 md:gap-16">
            <h2
                class="display-heading px-2 text-center"
                style="font-size: clamp(2.75rem, 10vw, 140px)"
                appFadeIn
                [fadeDelay]="0"
                [fadeY]="40"
            >
                About me
            </h2>

            <p
                #animatedParagraph
                class="relative mx-auto max-w-[65ch] px-1 text-center font-medium leading-relaxed text-[var(--text-primary)]"
                style="font-size: clamp(1rem, 2vw, 1.35rem)"
            >
                <span
                    *ngFor="let char of chars; let i = index; trackBy: trackByIndex"
                    class="transition-opacity duration-150"
                    [style.opacity]="charOpacities[i]"
                    >{{ char }}</span
                >
            </p>
        </div>

        <div class="mt-16 sm:mt-20 md:mt-24" appFadeIn [fadeDelay]="0.4" [fadeY]="20">
            <app-contact-button></app-contact-button>
        </div>
    </div>
</section>
