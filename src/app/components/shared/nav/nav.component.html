<nav class="navbar" [class.scrolled]="isScrolled">
    <div class="container">
        <div class="nav-content">
            <!-- Logo -->
            <a href="#" class="logo gradient-text">
                <span class="logo-icon">AP</span>
            </a>

            <!-- Desktop Navigation -->
            <ul class="nav-links hide-mobile">
                <li *ngFor="let item of navItems">
                    <a [href]="item.href">{{ item.label }}</a>
                </li>
            </ul>

            <!-- Theme Toggle & Mobile Menu -->
            <div class="nav-actions">
                <app-theme-toggle></app-theme-toggle>

                <button class="mobile-menu-toggle hide-desktop" (click)="toggleMobileMenu()">
                    <svg *ngIf="!isMobileMenuOpen" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                    <svg *ngIf="isMobileMenuOpen" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile Menu -->
    <div class="mobile-menu" [class.open]="isMobileMenuOpen">
        <ul class="mobile-nav-links">
            <li *ngFor="let item of navItems">
                <a [href]="item.href" (click)="closeMobileMenu()">{{ item.label }}</a>
            </li>
        </ul>
    </div>
</nav>
