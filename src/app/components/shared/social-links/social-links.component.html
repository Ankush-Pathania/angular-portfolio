<div class="social-links">
    <a *ngFor="let link of socialLinks()" [href]="link.url" [title]="link.platform" class="social-link pill-button"
        [attr.data-platform]="link.icon" target="_blank" rel="noopener noreferrer">
        <span class="pill-icon" [innerHTML]="getIconSvg(link.icon)"></span>
        <span class="pill-label">{{ link.platform }}</span>
    </a>
</div>
