<section id="contact" class="contact section">
    <div class="container">
        <div class="section-header scroll-animate" appScrollAnimation>
            <h2 class="gradient-text">Get In Touch</h2>
            <p class="section-subtitle">Let's work together</p>
        </div>

        <div class="contact-content">
            <div class="contact-info scroll-animate-left" appScrollAnimation>
                <h3>Contact Information</h3>

                <div class="info-item">
                    <div class="info-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z">
                            </path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                    </div>
                    <div>
                        <h4>Email</h4>
                        <a [href]="'mailto:' + profile().email">{{ profile().email }}</a>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
                            </path>
                        </svg>
                    </div>
                    <div>
                        <h4>Phone</h4>
                        <a [href]="'tel:' + profile().phone">{{ profile().phone }}</a>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                            <circle cx="12" cy="10" r="3"></circle>
                        </svg>
                    </div>
                    <div>
                        <h4>Location</h4>
                        <p>{{ profile().location }}</p>
                    </div>
                </div>

                <!-- <div class="social-links">
                    <h4>Follow Me</h4>
                    <div class="social-icons">
                        <a *ngFor="let link of socialLinks()" [href]="link.url" target="_blank"
                            rel="noopener noreferrer" class="social-icon glass">
                            <span>{{ link.platform.charAt(0) }}</span>
                        </a>
                    </div>
                </div> -->
            </div>

            <div class="contact-form-wrapper scroll-animate-right" appScrollAnimation>
                <form class="contact-form glass" (ngSubmit)="onSubmit()" #contactForm="ngForm">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" [(ngModel)]="formData.name" required
                            placeholder="Your name">
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" [(ngModel)]="formData.email" required
                            placeholder="your.email@example.com">
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" [(ngModel)]="formData.message" required rows="5"
                            placeholder="Your message..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary" [disabled]="!contactForm.valid || isSubmitting">
                        <span *ngIf="!isSubmitting">Send Message</span>
                        <span *ngIf="isSubmitting">Sending...</span>
                    </button>

                    <div *ngIf="submitSuccess" class="success-message">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                            <polyline points="22 4 12 14.01 9 11.01"></polyline>
                        </svg>
                        Message sent successfully!
                    </div>

                    <div *ngIf="submitError" class="error-message">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                        {{ errorMessage }}
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
