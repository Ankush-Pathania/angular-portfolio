<section
    #section
    class="marquee-section overflow-hidden bg-[#0C0C0C] pb-10 pt-24 sm:pt-32 md:pt-40"
>
    <div class="flex flex-col gap-3">
        <div
            class="flex gap-3"
            [style.transform]="'translateX(' + row1Offset + 'px)'"
            [style.willChange]="'transform'"
        >
            <img
                *ngFor="let src of row1; trackBy: trackByIndex"
                [src]="src"
                alt="Motion preview"
                loading="lazy"
                class="h-[270px] w-[420px] shrink-0 rounded-2xl object-cover"
            />
        </div>

        <div
            class="flex gap-3"
            [style.transform]="'translateX(' + row2Offset + 'px)'"
            [style.willChange]="'transform'"
        >
            <img
                *ngFor="let src of row2; trackBy: trackByIndex"
                [src]="src"
                alt="Motion preview"
                loading="lazy"
                class="h-[270px] w-[420px] shrink-0 rounded-2xl object-cover"
            />
        </div>
    </div>
</section>
