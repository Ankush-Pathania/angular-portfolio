<section id="tech-stack" class="toolkit">
    <!-- Quiet atmosphere — depth without noise -->
    <div class="toolkit-atmosphere" aria-hidden="true">
        <div class="glow glow-a"></div>
        <div class="glow glow-b"></div>
        <div class="grain"></div>
    </div>

    <!-- Two décor pieces only — balanced, not a prop closet -->
    <img
        class="decor decor-left"
        [src]="decor.moon"
        alt=""
        width="160"
        height="160"
        loading="lazy"
        appFadeIn
        [fadeDelay]="0.1"
        [fadeX]="-40"
        [fadeY]="0"
    />
    <img
        class="decor decor-right"
        [src]="decor.lego"
        alt=""
        width="160"
        height="160"
        loading="lazy"
        appFadeIn
        [fadeDelay]="0.15"
        [fadeX]="40"
        [fadeY]="0"
    />

    <div class="toolkit-shell">
        <!--
          First read: one composition.
          Title carries weight. One supporting sentence. Nothing else.
        -->
        <header class="toolkit-header" appFadeIn [fadeY]="28">
            <p class="eyebrow">Toolkit</p>
            <h2 class="display-heading toolkit-title">Tech Stack</h2>
            <p class="toolkit-lead">
                What I reach for when the brief is open — not every tool I have ever touched,
                the ones that earn a place on the desk.
            </p>
        </header>

        <!--
          Daily drivers: scannable in one glance.
          Large type, not cards. Hierarchy over decoration.
        -->
        <div class="daily" appFadeIn [fadeDelay]="0.08" [fadeY]="24" *ngIf="dailyDrivers.length">
            <div class="daily-label">
                <span>Daily drivers</span>
                <span class="daily-rule" aria-hidden="true"></span>
            </div>

            <ul class="daily-list" role="list">
                <li *ngFor="let skill of dailyDrivers; let i = index; trackBy: trackByName" class="daily-item">
                    <span class="daily-index">0{{ i + 1 }}</span>
                    <span class="daily-name">{{ skill.name }}</span>
                    <span class="daily-meter" aria-hidden="true">
                        <span class="daily-meter-fill" [appAnimateBar]="skill.level"></span>
                    </span>
                    <span class="daily-level">{{ skill.level }}%</span>
                </li>
            </ul>
        </div>

        <!--
          Full toolkit: three disciplines.
          Same row pattern everywhere → pattern recognition, less cognitive load.
        -->
        <div class="disciplines" appFadeIn [fadeDelay]="0.14" [fadeY]="28">
            <article
                class="discipline"
                *ngFor="let col of columns; trackBy: trackByColumn"
            >
                <header class="discipline-head">
                    <span class="discipline-index">{{ col.index }}</span>
                    <div>
                        <h3 class="discipline-label">{{ col.label }}</h3>
                        <p class="discipline-intent">{{ col.intent }}</p>
                    </div>
                </header>

                <ul class="skill-index" role="list">
                    <li *ngFor="let skill of col.skills; trackBy: trackByName">
                        <div class="skill-row">
                            <span class="skill-name">{{ skill.name }}</span>
                            <span class="skill-line" aria-hidden="true">
                                <span class="skill-line-fill" [appAnimateBar]="skill.level"></span>
                            </span>
                            <span class="skill-level">{{ skill.level }}%</span>
                        </div>
                    </li>
                </ul>
            </article>
        </div>
    </div>
</section>
