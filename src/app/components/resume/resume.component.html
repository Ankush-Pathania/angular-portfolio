<section id="resume" class="edu-brand">
    <div class="glow a" aria-hidden="true"></div>
    <div class="glow b" aria-hidden="true"></div>

    <div
        class="float-deco left"
        appMagnet
        [magnetPadding]="70"
        [magnetStrength]="4"
        appFadeIn
        [fadeX]="-50"
        [fadeY]="0"
    >
        <img [src]="decor.moon" alt="" width="140" height="140" loading="lazy" />
    </div>
    <div
        class="float-deco right"
        appMagnet
        [magnetPadding]="70"
        [magnetStrength]="4"
        appFadeIn
        [fadeDelay]="0.12"
        [fadeX]="50"
        [fadeY]="0"
    >
        <img [src]="decor.lego" alt="" width="140" height="140" loading="lazy" />
    </div>

    <div class="brand-inner">
        <header class="brand-head" appFadeIn [fadeY]="28">
            <p class="eyebrow">Credentials</p>
            <h2 class="display-heading">Education</h2>
            <p class="lead">Academic roots and industry training — stamped into the brand.</p>
        </header>

        <!-- Ambient brand wordmark ribbon (decorative, not a card carousel) -->
        <div class="brand-ribbon" aria-hidden="true" appFadeIn [fadeDelay]="0.08" [fadeY]="16">
            <div class="ribbon-track">
                <span *ngFor="let name of brandRibbon">{{ name }}</span>
            </div>
        </div>

        <div class="credential-stage">
            <article
                *ngFor="let edu of education(); let i = index; trackBy: trackByDegree"
                class="credential"
                [class.featured]="edu.type === 'internship'"
                [style.--i]="i"
                appFadeIn
                [fadeDelay]="i * 0.12"
                [fadeY]="36"
                appTilt3d
                [tiltMax]="9"
                [tiltScale]="1.02"
            >
                <div class="credential-foil" aria-hidden="true"></div>
                <div class="credential-mark" aria-hidden="true">{{ initials(edu) }}</div>

                <div
                    class="seal"
                    appMagnet
                    [magnetPadding]="40"
                    [magnetStrength]="3"
                >
                    <span class="seal-ring"></span>
                    <span class="seal-core">{{ (i + 1) | number: '2.0-0' }}</span>
                </div>

                <div class="credential-body">
                    <div class="tags">
                        <span class="type-tag" [attr.data-type]="edu.type || 'degree'">
                            {{ typeLabel(edu) }}
                        </span>
                        <span class="period-tag">{{ edu.period }}</span>
                    </div>

                    <h3 class="degree">{{ edu.degree }}</h3>
                    <p class="institution">{{ edu.institution }}</p>
                    <p class="copy">{{ edu.description }}</p>

                    <div class="stamp-line" aria-hidden="true">
                        <span></span>
                        <em>Verified path</em>
                        <span></span>
                    </div>
                </div>
            </article>
        </div>
    </div>
</section>
