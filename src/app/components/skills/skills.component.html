<section id="skills" class="skills section">
    <div class="container">
        <div class="section-header scroll-animate" appScrollAnimation>
            <h2 class="gradient-text">Skills & Expertise</h2>
            <p class="section-subtitle">Technologies I work with</p>
        </div>

        <!-- Frontend Development -->
        <div class="skill-category scroll-animate" appScrollAnimation>
            <h3 class="category-title">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="16 18 22 12 16 6"></polyline>
                    <polyline points="8 6 2 12 8 18"></polyline>
                </svg>
                Frontend Development
            </h3>
            <div class="skills-grid">
                <div *ngFor="let skill of frontendSkills; let i = index" class="skill-card glass scroll-animate-scale"
                    [style.animation-delay]="(i * 0.1) + 's'" appScrollAnimation>
                    <div class="skill-header">
                        <h4>{{ skill.name }}</h4>
                        <span class="skill-level">{{ skill.level }}%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" [style.width.%]="skill.level"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tools & Technologies -->
        <div class="skill-category scroll-animate" appScrollAnimation>
            <h3 class="category-title">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z">
                    </path>
                </svg>
                Tools & Technologies
            </h3>
            <div class="skills-grid">
                <div *ngFor="let skill of toolsSkills; let i = index" class="skill-card glass scroll-animate-scale"
                    [style.animation-delay]="(i * 0.1) + 's'" appScrollAnimation>
                    <div class="skill-header">
                        <h4>{{ skill.name }}</h4>
                        <span class="skill-level">{{ skill.level }}%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" [style.width.%]="skill.level"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Professional Skills -->
        <div class="skill-category scroll-animate" appScrollAnimation>
            <h3 class="category-title">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
                Professional Skills
            </h3>
            <div class="skills-grid">
                <div *ngFor="let skill of professionalSkills; let i = index"
                    class="skill-card glass scroll-animate-scale" [style.animation-delay]="(i * 0.1) + 's'"
                    appScrollAnimation>
                    <div class="skill-header">
                        <h4>{{ skill.name }}</h4>
                        <span class="skill-level">{{ skill.level }}%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" [style.width.%]="skill.level"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
