<section class="hero">
  <!-- Three.js Background -->
  <!-- <div #threeContainer class="three-container"></div> -->

  <!-- Sun/Moon Background -->
  

  <!-- Hero Content -->
  <div class="hero-content">
    <div class="container">
      <div class="hero-glass-container">
        <div class="hero-inner">
          <!-- Greeting -->
          <div class="greeting animate-fadeInUp justify-content-center">
            <span class="wave">👋</span>
            <span>Hello, I'm</span>
          </div>

          <!-- Name -->
          <h1 class="name gradient-text">
            <span *ngFor="let char of nameChars; let i = index; trackBy: trackByIndex" class="char"
              [style.animation-delay]="(i * 0.1) + 's'">
              {{ char === ' ' ? '\u00A0' : char }}
            </span>
          </h1>

          <!-- Role -->
          <h2 class="role animate-fadeInUp stagger-2">
            {{ profile().role }}
          </h2>

          <!-- Tagline -->
          <p class="tagline animate-fadeInUp stagger-3">
            {{ profile().tagline }}
          </p>

          <!-- CTA Buttons -->
          <div class="cta-buttons animate-fadeInUp stagger-4">
            <button class="btn btn-primary" (click)="scrollToProjects()">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
              </svg>
              View Projects
            </button>

            <button class="btn btn-secondary" (click)="scrollToContact()">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
              Contact Me
            </button>
          </div>

          <!-- Social Links -->
          <div class="hero-social animate-fadeInUp stagger-5">
            <app-social-links></app-social-links>
          </div>

          <!-- Scroll Indicator -->
          <div class="scroll-indicator animate-bounce">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 5v14M19 12l-7 7-7-7" />
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
