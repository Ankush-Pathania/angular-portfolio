<section class="hero">
  <!-- Three.js Background -->
  <div #threeContainer class="three-container"></div>

  <!-- Sun/Moon Background -->
  <div class="celestial-background">
    <!-- Moon for Dark Mode -->
    <div class="moon" [class.visible]="isDarkMode()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
        <!-- Moon circle with craters -->
        <defs>
          <radialGradient id="moonGradient" cx="35%" cy="35%">
            <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
            <stop offset="40%" style="stop-color:#f5f5f5;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#d0d0d0;stop-opacity:1" />
          </radialGradient>
          <filter id="moonGlow">
            <feGaussianBlur stdDeviation="6" result="coloredBlur" />
            <feMerge>
              <feMergeNode in="coloredBlur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>
        <!-- Moon glow background -->
        <circle cx="100" cy="100" r="85" fill="rgba(255, 255, 255, 0.1)" />
        <!-- Main moon circle -->
        <circle cx="100" cy="100" r="75" fill="url(#moonGradient)" filter="url(#moonGlow)" />
        <!-- Craters with better definition -->
        <circle cx="70" cy="75" r="16" fill="#a0a0a0" opacity="0.4" />
        <circle cx="72" cy="77" r="12" fill="#b8b8b8" opacity="0.3" />
        <circle cx="120" cy="90" r="13" fill="#a0a0a0" opacity="0.35" />
        <circle cx="122" cy="92" r="9" fill="#b8b8b8" opacity="0.25" />
        <circle cx="85" cy="115" r="11" fill="#a0a0a0" opacity="0.3" />
        <circle cx="125" cy="65" r="9" fill="#a0a0a0" opacity="0.35" />
        <circle cx="105" cy="125" r="8" fill="#a0a0a0" opacity="0.3" />
      </svg>
    </div>

    <!-- Sun for Light Mode -->
    <div class="sun" [class.visible]="!isDarkMode()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
        <defs>
          <radialGradient id="sunGradient" cx="50%" cy="50%">
            <stop offset="0%" style="stop-color:#ffeb3b;stop-opacity:1" />
            <stop offset="30%" style="stop-color:#ffc107;stop-opacity:1" />
            <stop offset="70%" style="stop-color:#ff9800;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#ff6f00;stop-opacity:0.9" />
          </radialGradient>
          <filter id="sunGlow">
            <feGaussianBlur stdDeviation="8" result="coloredBlur" />
            <feMerge>
              <feMergeNode in="coloredBlur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>
        <!-- Sun rays -->
        <g class="sun-rays" stroke="#ffb300" stroke-width="5" stroke-linecap="round" opacity="0.9">
          <line x1="100" y1="15" x2="100" y2="35" />
          <line x1="100" y1="165" x2="100" y2="185" />
          <line x1="15" y1="100" x2="35" y2="100" />
          <line x1="165" y1="100" x2="185" y2="100" />
          <line x1="30" y1="30" x2="45" y2="45" />
          <line x1="155" y1="155" x2="170" y2="170" />
          <line x1="170" y1="30" x2="155" y2="45" />
          <line x1="45" y1="155" x2="30" y2="170" />
        </g>
        <!-- Outer sun glow -->
        <circle cx="100" cy="100" r="60" fill="rgba(255, 193, 7, 0.2)" />
        <!-- Main sun circle -->
        <circle cx="100" cy="100" r="50" fill="url(#sunGradient)" filter="url(#sunGlow)" />
      </svg>
    </div>
  </div>

  <!-- Hero Content -->
  <div class="hero-content">
    <div class="container">
      <div class="hero-glass-container">
        <div class="hero-inner">
          <!-- Greeting -->
          <div class="greeting animate-fadeInUp justify-content-center">
            <span class="wave">👋</span>
            <span>Hello, I'm</span>
          </div>

          <!-- Name -->
          <h1 class="name gradient-text">
            <span *ngFor="let char of nameChars; let i = index; trackBy: trackByIndex" class="char"
              [style.animation-delay]="(i * 0.1) + 's'">
              {{ char === ' ' ? '\u00A0' : char }}
            </span>
          </h1>

          <!-- Role -->
          <h2 class="role animate-fadeInUp stagger-2">
            {{ profile().role }}
          </h2>

          <!-- Tagline -->
          <p class="tagline animate-fadeInUp stagger-3">
            {{ profile().tagline }}
          </p>

          <!-- CTA Buttons -->
          <div class="cta-buttons animate-fadeInUp stagger-4">
            <button class="btn btn-primary" (click)="scrollToProjects()">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
              </svg>
              View Projects
            </button>

            <button class="btn btn-secondary" (click)="scrollToContact()">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
              Contact Me
            </button>
          </div>

          <!-- Social Links -->
          <div class="hero-social animate-fadeInUp stagger-5">
            <app-social-links></app-social-links>
          </div>

          <!-- Scroll Indicator -->
          <div class="scroll-indicator animate-bounce">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 5v14M19 12l-7 7-7-7" />
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
